name: Xiaomi Redmi AX6000 LEDE DulWiFi
on:
  workflow_dispatch:
  push:
    branches: [xiaomi-redmi-router-ax6000-lede]
    paths: ['custom/xiaomi-redmi-router-ax6000/**', 'files/**', 'feeds.conf.default', '.github/workflows/Redmi-AX6000-DulWiFi.yml']
permissions:
  contents: write
concurrency:
  group: lede-redmi-ax6000-${{ github.ref }}
  cancel-in-progress: false
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq openssl zstd libelf-dev
      - uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: lede-redmi-ax6000-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lede-redmi-ax6000-${{ runner.os }}-
      - name: Resolve pinned feeds and verify configuration
        run: bash custom/xiaomi-redmi-router-ax6000/prepare.sh
      - name: Download sources
        run: make download -j4
      - name: Compile source
        run: |
          set -o pipefail
          mkdir -p .ccache
          ccache -M 5G
          make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
      - name: Validate firmware and collect
        run: |
          set -eu
          ROOT=$(find build_dir -path '*/root-mediatek/etc/shadow' -type f | head -n1)
          test -n "$ROOT"
          test "$(awk -F: '$1=="root" {print $2}' "$ROOT")" = "$(awk -F: '$1=="root" {print $2}' files/etc/shadow)"
          IMAGE=$(find bin/targets/mediatek/filogic -name '*xiaomi_redmi-router-ax6000*sysupgrade.bin' -size +5M | head -n1)
          MANIFEST=$(find bin/targets/mediatek/filogic -name '*xiaomi_redmi-router-ax6000*.manifest' | head -n1)
          test -n "$IMAGE" && test -n "$MANIFEST"
          for p in kmod-mt7915e luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-store quickstart luci-app-quickstart luci-theme-argon luci-app-ttyd luci-app-nps npc; do grep -q "^$p " "$MANIFEST"; done
          mkdir -p release
          cp "$IMAGE" "$MANIFEST" build.config feeds.lock.actual release/
          (cd release && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Redmi-AX6000-build-${{ github.run_number }}
          path: |
            release/
            bin/targets/mediatek/filogic/*xiaomi_redmi-router-ax6000*
            build.log
            build.config
            feeds.lock.actual
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dl
            .ccache
          key: lede-redmi-ax6000-${{ runner.os }}-${{ github.run_id }}
      - name: Publish verified firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "Redmi-AX6000-LEDE-DulWiFi-${GITHUB_RUN_NUMBER}" release/* --target "$GITHUB_SHA" --title "Xiaomi Redmi AX6000 DulWiFi-Tk LEDE ${GITHUB_RUN_NUMBER}" --notes 'LEDE source target xiaomi_redmi-router-ax6000; source-default mt76 WiFi and source DTS parameters. Management 192.168.9.1, root password password. DulWiFi-2.4G / DulWiFi-5G, WiFi password password. Includes PassWall 26.3.6-1, PassWall2 26.3.5-1, HomeProxy, OpenClash, iStore, QuickStart, Argon, TTYD and NPS. NPS 8.134.201.189:8024 uses physical WAN MAC at first boot.'
