name: JuLiang OS Matrix (MT7981/MT7986)

# Runs on push. Which groups are built is read from custom/matrix/group.txt
# (g1..g4 or all), so a single file edit selects the run without needing
# workflow_dispatch, which GitHub only exposes for workflows on the default branch.

on:
  workflow_dispatch:
  push:
    branches: [jontaoNpS-rax3000m-nand-live-os]
    paths:
      - 'custom/matrix/**'
      - 'scripts/build-juilang-matrix.sh'
      - 'scripts/juilang-overlay.sh'
      - 'custom/rax3000m-nand/files/**'
      - '.github/workflows/JuLiang-Matrix.yml'

permissions:
  contents: write

concurrency:
  group: juilang-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan groups
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -eu
          group="$(tr -d '[:space:]' < custom/matrix/group.txt 2>/dev/null || echo all)"
          case "$group" in
            all) list='["g1","g2","g3","g4","g5"]' ;;
            g1|g2|g3|g4|g5) list="[\"$group\"]" ;;
            *) echo "Unknown group '$group' in custom/matrix/group.txt" >&2; exit 1 ;;
          esac
          echo "matrix=$list" >> "$GITHUB_OUTPUT"
          echo "groups: $list"

  build:
    name: Matrix ${{ matrix.group }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl jq openssl zstd libelf-dev

      - uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: juilang-matrix-${{ runner.os }}-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            juilang-matrix-${{ runner.os }}-${{ matrix.group }}-

      - name: Build group ${{ matrix.group }}
        run: bash scripts/build-juilang-matrix.sh ${{ matrix.group }} || { tail -n 200 build.log 2>/dev/null || true; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JuLiangOS-${{ matrix.group }}-${{ github.run_number }}
          path: |
            release/
            build.log
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dl
            .ccache
          key: juilang-matrix-${{ runner.os }}-${{ matrix.group }}-${{ github.run_id }}

  publish:
    name: Publish matrix release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.bin' -o -name '*.manifest' -o -name 'build.config' \) -exec cp -a {} release/ \;
          ls -lh release
          cd release && sha256sum * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "JuLiangOS-Matrix-${GITHUB_RUN_NUMBER}" release/* \
            --target "$GITHUB_SHA" \
            --title "JuLiang OS Matrix ${GITHUB_RUN_NUMBER}" \
            --notes 'Multi-device JuLiang OS build. Each image: management 192.168.7.1, root @password@, JuLiang OS-2.4G/-5G and Live-2.4G/-5G with passphrase 66668888, br-live 172.16.1.1/24, PassWall2 + HomeProxy, SQM (cake), WAN DHCP lease guard, no IPv6.'
