name: CMCC A10 jontaoNpS LEDE
on:
  workflow_dispatch:
  push:
    branches: [jontaoNpS-cmcc-a10]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq openssl zstd libelf-dev
      - uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: jontao-nps-cmcc_a10-${{ runner.os }}-${{ github.run_id }}
          restore-keys: jontao-nps-cmcc_a10-${{ runner.os }}-
      - name: Verify source, feeds and firmware configuration
        run: bash custom/device/prepare.sh
      - name: Download sources
        run: make download -j4
      - name: Compile source
        run: |
          set -o pipefail
          mkdir -p .ccache
          ccache -M 5G
          make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
      - name: Validate and collect
        run: |
          set -eu
          ROOT=$(find build_dir -path '*/root-mediatek/etc/shadow' -type f | head -n1)
          test -n "$ROOT"
          test "$(awk -F: '$1=="root" {print $2}' "$ROOT")" = "$(awk -F: '$1=="root" {print $2}' files/etc/shadow)"
          IMAGE=$(find bin/targets/mediatek/filogic -name '*cmcc_a10*sysupgrade.bin' -size +5M | head -n1)
          MANIFEST=$(find bin/targets/mediatek/filogic -name '*cmcc_a10*.manifest' | head -n1)
          test -n "$IMAGE" && test -n "$MANIFEST"
          for p in kmod-mt7915e kmod-mt7981-firmware luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-store quickstart luci-app-quickstart luci-theme-argon luci-app-ttyd luci-app-nps npc; do grep -q "^$p " "$MANIFEST"; done
          for p in luci-app-ddns ddns-scripts luci-app-nlbwmon nlbwmon luci-app-wrtbwmon wrtbwmon luci-app-wol wol luci-app-vlmcsd vlmcsd; do ! grep -q "^$p " "$MANIFEST"; done
          grep -q "server.datatype = \"host\"" "${ROOT%/etc/shadow}/usr/lib/lua/luci/model/cbi/nps.lua"
          grep -q '47.83.9.208' "${ROOT%/etc/shadow}/usr/libexec/dulwifi-firstboot"
          mkdir -p release
          cp "$IMAGE" "$MANIFEST" build.config release/
          (cd release && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CMCC-A10-${{ github.run_number }}
          path: |
            release/
            bin/targets/mediatek/filogic/*cmcc_a10*
            build.log
            build.config
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dl
            .ccache
          key: jontao-nps-cmcc_a10-${{ runner.os }}-${{ github.run_id }}
      - name: Publish verified firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jontaoNpS-cmcc_a10-${{ github.run_number }}" release/* --target "$GITHUB_SHA" --title "CMCC A10 jontaoNpS ${{ github.run_number }}" --notes 'LEDE target cmcc_a10; DTS mt7981b-cmcc-a10; source-default mt76 WiFi. 192.168.9.1/password; DulWiFi-2.4G and DulWiFi-5G/password. NPS accepts IPv4 or domain names, uses first-boot WAN MAC key and defaults to 47.83.9.208:8024. DDNS, bandwidth monitor, Wake-on-LAN and Vlmcsd removed.'
