name: CMCC A10 U-BootMod jontaoNpS LEDE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  DEVICE_PROFILE: cmcc_a10-ubootmod

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq openssl zstd libelf-dev

      - uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: jontao-nps-cmcc-a10-ubootmod-${{ runner.os }}-${{ github.run_id }}
          restore-keys: jontao-nps-cmcc-a10-ubootmod-${{ runner.os }}-

      - name: Apply CMCC A10 U-BootMod source profile
        run: bash custom/device/prepare-cmcc-a10-ubootmod.sh

      - name: Download sources
        run: make download -j4

      - name: Compile source
        run: |
          set -o pipefail
          mkdir -p .ccache
          ccache -M 5G
          make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log

      - name: Validate and collect
        run: |
          set -eu
          ROOT=$(find build_dir -path '*/root-mediatek/etc/shadow' -type f | head -n1)
          test -n "$ROOT"
          test "$(awk -F: '$1=="root" {print $2}' "$ROOT")" = "$(awk -F: '$1=="root" {print $2}' files/etc/shadow)"
          IMAGE=$(find bin/targets/mediatek/filogic -name '*cmcc_a10-ubootmod*sysupgrade.itb' -size +5M | head -n1)
          MANIFEST=$(find bin/targets/mediatek/filogic -name '*cmcc_a10-ubootmod*.manifest' | head -n1)
          test -n "$IMAGE" && test -n "$MANIFEST"
          for p in kmod-mt7915e kmod-mt7981-firmware luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-store quickstart luci-app-quickstart luci-theme-argon luci-app-ttyd luci-app-nps npc; do grep -q "^$p " "$MANIFEST"; done
          grep -q 'nps.jontao.top:8024' "${ROOT%/etc/shadow}/usr/libexec/dulwifi-firstboot"
          mkdir -p release
          cp "$IMAGE" "$MANIFEST" build.config release/
          (cd release && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CMCC-A10-UBOOTMOD-${{ github.run_number }}
          path: |
            release/
            bin/targets/mediatek/filogic/*cmcc_a10-ubootmod*
            build.log
            build.config
          retention-days: 30

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dl
            .ccache
          key: jontao-nps-cmcc-a10-ubootmod-${{ runner.os }}-${{ github.run_id }}

      - name: Publish verified firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jontaoNpS-cmcc-a10-ubootmod-${{ github.run_number }}" release/* --target "$GITHUB_SHA" --title "CMCC A10 U-BootMod jontaoNpS ${{ github.run_number }}" --notes 'CMCC A10 OpenWrt U-Boot layout; SPI-NAND UBI 0x00580000-0x08000000; FIT sysupgrade.itb; Linux 6.6.x. Defaults: 192.168.9.1/password; DulWiFi-2.4G and DulWiFi-5G/password. NPS first boot uses WAN MAC and nps.jontao.top:8024.'
