name: GIELINK G33Pro V1.3 jontaoNpS LEDE
on:
  workflow_dispatch:
  push:
    branches: [jontaoNpS-gielink-g33pro-v1-lede]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build host
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq openssl zstd libelf-dev
      - uses: actions/cache/restore@v4
        with:
          path: |
            dl
            .ccache
          key: jontao-nps-gielink_g33pro-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: jontao-nps-gielink_g33pro-v1-${{ runner.os }}-
      - name: Verify source, feeds and firmware configuration
        run: bash custom/device/prepare.sh
      - name: Download sources
        run: make download -j4
      - name: Compile source
        run: |
          set -o pipefail
          mkdir -p .ccache
          ccache -M 5G
          make -j$(nproc) 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
          KERNEL_MT7530="$(find build_dir/target-*/linux-mediatek_filogic/linux-6.12*/drivers/net/dsa/mt7530.c -type f | head -n1)"
          test -n "$KERNEL_MT7530" || { echo "ERROR: prepared mt7530.c not found"; exit 1; }
          grep -A3 'irq = irq_find_mapping(priv->irq_domain, p);' "$KERNEL_MT7530" | grep -q 'if (irq)' || {
            echo "ERROR: MT7530 unmapped-IRQ guard patch was not applied"
            exit 1
          }
          echo "Verified MT7530 unmapped-IRQ guard in prepared Linux source."
      - name: Validate and collect
        run: |
          set -eu
          ROOT=$(find build_dir -path '*/root-mediatek/etc/shadow' -type f | head -n1)
          test -n "$ROOT"
          test "$(awk -F: '$1=="root" {print $2}' "$ROOT")" = "$(awk -F: '$1=="root" {print $2}' files/etc/shadow)"
          mapfile -t IMAGES < <(find bin/targets/mediatek/filogic -type f \( -name '*gielink_g33pro-v1*factory.bin' -o -name '*gielink_g33pro-v1*sysupgrade.bin' \) -size +5M)
          MANIFEST=$(find bin/targets/mediatek/filogic -name '*gielink_g33pro-v1*.manifest' | head -n1)
          test "${#IMAGES[@]}" -gt 0 && test -n "$MANIFEST"
          for p in kmod-mt7915e kmod-mt7981-firmware luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-store quickstart luci-app-quickstart luci-theme-argon luci-app-ttyd luci-app-nps npc; do grep -q "^$p " "$MANIFEST"; done
          grep -q '47.83.9.208' "${ROOT%/etc/shadow}/usr/libexec/dulwifi-firstboot"
          mkdir -p release
          cp "${IMAGES[@]}" "$MANIFEST" build.config release/
          (cd release && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GIELINK-G33PRO-V1.3-LEDE-${{ github.run_number }}
          path: |
            release/
            bin/targets/mediatek/filogic/*gielink_g33pro-v1*
            build.log
            build.config
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dl
            .ccache
          key: jontao-nps-gielink_g33pro-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Publish verified firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jontaoNpS-gielink-g33pro-v1-lede-${{ github.run_number }}" release/* --target "$GITHUB_SHA" --title "GIELINK G33Pro V1.3 jontaoNpS LEDE ${{ github.run_number }}" --notes 'LEDE target gielink_g33pro-v1; G33Pro V1.3 China Unicom layout: stock MT7531 LAN1-LAN4 plus eth1 WAN; Q30Pro-validated UBI at 0x580000, raw size 0x7000000 (112 MiB, about 110 MiB usable). 192.168.9.1/password; DulWiFi-2.4G and DulWiFi-5G/password. NPS uses first-boot WAN MAC key and defaults to 47.83.9.208:8024. Package selection follows the verified LEDE jontaoNpS baseline.'

